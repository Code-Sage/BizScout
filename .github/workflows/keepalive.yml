name: Keep-alive tick (backup)

on:
  schedule:
    - cron: '*/10 * * * *' # GitHub may delay scheduled runs; cron-job.org is the primary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/internal/tick
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            -X POST "$API_URL/api/internal/tick" \
            -H "x-internal-token: $INTERNAL_API_TOKEN"
